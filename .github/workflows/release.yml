# Builds and publishes the installer when a version tag is pushed.
#
#   npm version patch && git push --follow-tags
#
# The release lands as a draft: it goes public only after you review the
# notes and check the binary.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The suites that hit the network and the real game folder cannot run
      # here: no War Thunder on a runner, and hammering an unofficial API from
      # CI would be rude. Run those locally before tagging.
      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
